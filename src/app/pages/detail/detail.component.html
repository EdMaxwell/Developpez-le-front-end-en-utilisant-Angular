<section class="detail-container">

  <!-- Toolbar avec bouton retour et titre -->
  <header class="toolbar">
    <button (click)="goBack()" aria-label="Return">&#8592;</button>
    <span class="toolbar-title">
      Stats for {{ (country$ | async)?.country }}
    </span>
  </header>

  <!-- Affichage du spinner pendant le chargement -->
  <ng-container *ngIf="(country$ | async) === undefined">
    <app-loading-spinner></app-loading-spinner>
  </ng-container>

  <!-- Affichage du message d’erreur si pays non trouvé ou erreur -->
  <ng-container *ngIf="(country$ | async) === null">
    <app-error-message
      [message]="countryNotFound ? 'Country not found.' : 'Error loading data. Please try again later.'">
    </app-error-message>
  </ng-container>

  <!-- Affichage principal si le pays existe -->
  <ng-container *ngIf="country$ | async as country">
    <ng-container *ngIf="!hasError">
      <!-- Statistiques globales -->
      <ng-container *ngIf="countryStats$ | async as stats">
        <div class="stats-section">
          <h3 class="stats-header">Global Stats</h3>
          <div class="stats-cards">
            <div class="stat-card">
              <div class="stat-title">Participations</div>
              <div class="stat-value">{{ stats.participationCount }}</div>
            </div>
            <div class="stat-card">
              <div class="stat-title">Total medals</div>
              <div class="stat-value">{{ stats.totalMedals }}</div>
            </div>
            <div class="stat-card">
              <div class="stat-title">Total athletes</div>
              <div class="stat-value">{{ stats.totalAthletes }}</div>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- Graphique en ligne -->
      <div class="chart-wrapper">
        <ngx-charts-line-chart
          [gradient]="false"
          [legend]="showLegend"
          [results]="medalSeries$ | async"
          [scheme]="'vivid'"
          [showXAxisLabel]="showXAxisLabel"
          [showYAxisLabel]="showYAxisLabel"
          [timeline]="timeline"
          [view]="viewSize"
          [xAxisLabel]="xAxisLabel"
          [xAxis]="showXAxis"
          [yAxisLabel]="yAxisLabel"
          [yAxis]="showYAxis"
        >
        </ngx-charts-line-chart>
      </div>
    </ng-container>
  </ng-container>

</section>
