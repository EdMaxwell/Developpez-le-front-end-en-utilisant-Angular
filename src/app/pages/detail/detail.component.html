<section class="detail-container">

  <!-- Toolbar avec bouton retour et titre -->
  <mat-toolbar class="title-toolbar">
    <button (click)="goBack()" mat-icon-button>
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="toolbar-title">
      Détails pour {{ (country$ | async)?.country }}
    </span>
  </mat-toolbar>

  <!-- Affichage du spinner pendant le chargement -->
  <ng-container *ngIf="(country$ | async) === undefined">
    <app-loading-spinner></app-loading-spinner>
  </ng-container>

  <!-- Affichage du message d’erreur si pays non trouvé ou erreur -->
  <ng-container *ngIf="(country$ | async) === null">
    <app-error-message
      [message]="countryNotFound ? 'Country not found.' : 'Error loading data. Please try again later.'">
    </app-error-message>
  </ng-container>

  <!-- Affichage principal si le pays existe -->
  <ng-container *ngIf="country$ | async as country">
    <ng-container *ngIf="!hasError">
      <!-- Statistiques globales -->
      <ng-container *ngIf="countryStats$ | async as stats">
        <div class="stats-section">
          <h3 class="stats-header">Global Stats</h3>
          <div class="stats-cards">
            <mat-card class="stat-card">
              <mat-card-title>Participations</mat-card-title>
              <mat-card-content>{{ stats.participationCount }}</mat-card-content>
            </mat-card>
            <mat-card class="stat-card">
              <mat-card-title>Total medals</mat-card-title>
              <mat-card-content>{{ stats.totalMedals }}</mat-card-content>
            </mat-card>
            <mat-card class="stat-card">
              <mat-card-title>Total athletes</mat-card-title>
              <mat-card-content>{{ stats.totalAthletes }}</mat-card-content>
            </mat-card>
          </div>
        </div>
      </ng-container>

      <!-- Graphique en ligne -->
      <div class="chart-wrapper">
        <ngx-charts-line-chart
          [gradient]="false"
          [legend]="showLegend"
          [results]="medalSeries$ | async"
          [scheme]="'vivid'"
          [showXAxisLabel]="showXAxisLabel"
          [showYAxisLabel]="showYAxisLabel"
          [timeline]="timeline"
          [view]="viewSize"
          [xAxisLabel]="xAxisLabel"
          [xAxis]="showXAxis"
          [yAxisLabel]="yAxisLabel"
          [yAxis]="showYAxis"
        >
        </ngx-charts-line-chart>
      </div>
    </ng-container>
  </ng-container>

</section>
